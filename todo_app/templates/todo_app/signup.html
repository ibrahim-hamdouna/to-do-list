{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/todo_app/signup.css' %}">
    <title>To Do List - Signup</title>
</head>
<body>
    <main class="signup-container">
        <div class="signup-card">
            <form method="POST">
                {% csrf_token %}
                <div class="input-group">
                    <label for="first_name">First Name</label>
                    <input type="first_name" id="first_name" name="first_name" placeholder="Enter your first name" value="{{ typed_data.first_name }}" required>
                </div>
                <div class="input-group">
                    <label for="last_name">Last Name</label>
                    <input type="last_name" id="last_name" name="last_name" placeholder="Enter your last name" value="{{ typed_data.last_name }}" required>
                </div>
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" value="{{ typed_data.username }}" required>
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" value="{{ typed_data.email }}" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                {% if messages %}
                <div class="error-messages">
                    {% for message in messages %}
                        <p class="message">{{ message }}</p>
                    {% endfor %}
                </div>
                {% endif %}
                <button type="submit">Sign up</button>
            </form>
            <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
        </div>
    </main>
</body>
</html>
